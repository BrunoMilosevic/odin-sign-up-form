<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Log In</title>
  </head>
  <body>
    <div class="container">
      <section class="left"></section>
      <section class="right login">
        <h3 class="login-header">Welcome Back!</h3>
        <form action="#" class="login-form">
          <div class="input-fields login-fields">
            <div class="email-div">
              <label for="email">Email</label>
              <input type="email" name="email" id="email" required />
            </div>
            <div class="password-div">
              <label for="password">Password</label>
              <input
                type="password"
                name="password"
                id="password"
                pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}"
                title="Password must contain at least one number, one uppercase letter, one lowercase letter and be 8 characters long "
                required
              />
            </div>
          </div>
          <div class="submit-field login-submit">
            <button id="login-btn">Login</button>
            <p class="no-account">
              Don't have an account?
              <a href="./index.html">Sign Up</a>
            </p>
          </div>
        </form>
      </section>
    </div>
  </body>
</html>
